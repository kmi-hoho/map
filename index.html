<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>검정대상 지도 뷰어</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        #header { 
            padding: 10px 15px; background-color: #f8f9fa; border-bottom: 1px solid #ddd; 
            z-index: 1000; position: relative; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; font-size: 14px;
        }
        .header-divider { border-left: 1px solid #ccc; height: 24px; }
        input[type="text"], input[type="date"], select { padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 5px 10px; border: 1px solid #999; background-color: #fff; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #e9ecef; }
        #map { height: calc(100vh - 55px); width: 100%; }
        
        .popup-table { border-collapse: collapse; width: 100%; font-size: 12px; text-align: center; }
        .popup-table th { background-color: #f2f6fc; color: #333; border: 1px solid #c8d4e3; padding: 6px; white-space: nowrap; }
        .popup-table td { border: 1px solid #c8d4e3; padding: 6px; white-space: nowrap; }
        .leaflet-popup-content { min-width: 350px !important; }
        
        /* 만료 임박 일수에 따른 행 강조 스타일 */
        .expiring-red td { background-color: #ffe6e6; color: #d93025; font-weight: bold; } /* 30일 이내 */
        .expiring-orange td { background-color: #fff3e0; color: #e65100; font-weight: bold; } /* 60일 이내 */
        .expiring-yellow td { background-color: #fffde7; color: #f57f17; font-weight: bold; } /* 90일 이내 */
    </style>
</head>
<body>

<div id="header">
    <div><b>검정대상 지도 뷰어</b></div>
    <div class="header-divider"></div>
    <div>
        <select id="searchCategory">
            <option value="orgName">기관명</option>
            <option value="branchName">지점명</option>
            <option value="modelName">모델명</option>
            <option value="serialNum">제조번호</option>
        </select>
        <input type="text" id="searchInput" placeholder="검색어 입력" />
    </div>
    <div class="header-divider"></div>
    <div>
        <label><b>최신기준일:</b> </label>
        <input type="date" id="startDate" /> ~ <input type="date" id="endDate" />
    </div>
    <div>
        <button id="searchBtn">검색</button>
        <button id="resetBtn">초기화</button>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    const map = L.map('map').setView([36.5, 127.5], 7);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markers = L.layerGroup().addTo(map);
    let allDevices = [];

    // 마커 아이콘 색상별 정의
    const getIconUrl = (color) => `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color}.png`;
    const iconOptions = { shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] };

    const redIcon = new L.Icon({ iconUrl: getIconUrl('red'), ...iconOptions });
    const orangeIcon = new L.Icon({ iconUrl: getIconUrl('orange'), ...iconOptions });
    const yellowIcon = new L.Icon({ iconUrl: getIconUrl('gold'), ...iconOptions }); // Leaflet 기본 제공 색상 중 gold가 노란색 역할
    const blueIcon = new L.Icon({ iconUrl: getIconUrl('blue'), ...iconOptions });

    function formatDate(dateObj) {
        const yyyy = dateObj.getFullYear();
        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
        const dd = String(dateObj.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    fetch('검정대상.csv')
        .then(response => {
            if (!response.ok) throw new Error("네트워크 응답이 정상이 아닙니다.");
            return response.arrayBuffer();
        })
        .then(buffer => {
            const decoder = new TextDecoder('euc-kr');
            const csvText = decoder.decode(buffer);
            
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    allDevices = [];
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);

                    data.forEach(row => {
                        const rowValues = Object.values(row);
                        const getVal = (key) => row[key] ? row[key].trim() : '';
                        const lat = parseFloat(getVal('위도') || rowValues[3]); 
                        const lng = parseFloat(getVal('경도') || rowValues[4]); 

                        if (!isNaN(lat) && !isNaN(lng)) {
                            const validPeriodDate = getVal('검정유효기간');
                            const testDateStr = getVal('검정일') || (rowValues.length > 0 ? rowValues[rowValues.length - 1].trim() : ''); 
                            let finalDateStr = "";

                            if (testDateStr && testDateStr.length >= 8) {
                                const dateObj = new Date(testDateStr);
                                if (!isNaN(dateObj)) {
                                    dateObj.setFullYear(dateObj.getFullYear() + 5);
                                    dateObj.setDate(dateObj.getDate() + 1);
                                    finalDateStr = formatDate(dateObj);
                                } else {
                                    finalDateStr = testDateStr;
                                }
                            } else {
                                finalDateStr = validPeriodDate;
                            }

                            // 남은 일수에 따른 등급 판별 (기본값 999: 안전)
                            let urgencyLevel = 999; 
                            
                            if (finalDateStr) {
                                const expDate = new Date(finalDateStr);
                                if (!isNaN(expDate)) {
                                    const diffTime = expDate - today;
                                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                                    
                                    if (diffDays <= 30) {
                                        urgencyLevel = 1; // 30일 이내 (빨강)
                                    } else if (diffDays <= 60) {
                                        urgencyLevel = 2; // 60일 이내 (주황)
                                    } else if (diffDays <= 90) {
                                        urgencyLevel = 3; // 90일 이내 (노랑)
                                    }
                                }
                            }

                            allDevices.push({
                                lat: lat, lng: lng, orgName: getVal('기관명'), branchName: getVal('지점명'),
                                modelName: getVal('모델명'), serialNum: getVal('제조번호'), latestDate: finalDateStr, 
                                urgencyLevel: urgencyLevel
                            });
                        }
                    });
                    applyFiltersAndRender();
                }
            });
        })
        .catch(error => alert("데이터를 불러오는 데 실패했습니다: " + error.message));

    function applyFiltersAndRender() {
        markers.clearLayers();
        const category = document.getElementById('searchCategory').value;
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const groupedData = {};

        allDevices.forEach(dev => {
            let textMatch = true;
            if (keyword) {
                const targetValue = (dev[category] || '').toLowerCase();
                if (!targetValue.includes(keyword)) textMatch = false;
            }

            let dateMatch = true;
            if (dev.latestDate) {
                if (startDate && dev.latestDate < startDate) dateMatch = false;
                if (endDate && dev.latestDate > endDate) dateMatch = false;
            } else if (startDate || endDate) {
                dateMatch = false; 
            }

            if (textMatch && dateMatch) {
                const locationKey = `${dev.lat}_${dev.lng}`;
                if (!groupedData[locationKey]) {
                    groupedData[locationKey] = { lat: dev.lat, lng: dev.lng, devices: [], maxUrgency: 999 };
                }
                groupedData[locationKey].devices.push(dev);
                
                // 한 지점에 여러 장비가 있을 경우, 가장 심각한(숫자가 작은) 등급을 지점의 대표 등급으로 설정
                if (dev.urgencyLevel < groupedData[locationKey].maxUrgency) {
                    groupedData[locationKey].maxUrgency = dev.urgencyLevel;
                }
            }
        });

        Object.values(groupedData).forEach(group => {
            const devices = group.devices;
            let tableRowsHtml = "";
            devices.forEach((dev, index) => {
                
                // 장비의 만료일 등급에 따라 행 CSS 클래스 할당
                let rowClass = '';
                if (dev.urgencyLevel === 1) rowClass = ' class="expiring-red"';
                else if (dev.urgencyLevel === 2) rowClass = ' class="expiring-orange"';
                else if (dev.urgencyLevel === 3) rowClass = ' class="expiring-yellow"';

                tableRowsHtml += `<tr${rowClass}>`;
                if (index === 0) {
                    tableRowsHtml += `<td rowspan="${devices.length}">${dev.orgName}</td>`;
                    tableRowsHtml += `<td rowspan="${devices.length}">${dev.branchName}</td>`;
                }
                tableRowsHtml += `<td>${dev.modelName}</td><td>${dev.serialNum}</td><td>${dev.latestDate}</td></tr>`;
            });

            const popupContent = `
                <table class="popup-table">
                    <thead><tr><th>기관명</th><th>지점명</th><th>모델명</th><th>제조번호</th><th>최신기준일 (만료일)</th></tr></thead>
                    <tbody>${tableRowsHtml}</tbody>
                </table>`;

            // 지점의 최고 위험 등급에 따라 마커 색상 결정
            let markerIcon = blueIcon;
            if (group.maxUrgency === 1) markerIcon = redIcon;
            else if (group.maxUrgency === 2) markerIcon = orangeIcon;
            else if (group.maxUrgency === 3) markerIcon = yellowIcon;

            L.marker([group.lat, group.lng], { icon: markerIcon }).addTo(markers).bindPopup(popupContent, { maxWidth: 600 });
        });
    }

    document.getElementById('searchBtn').addEventListener('click', applyFiltersAndRender);
    document.getElementById('searchInput').addEventListener('keyup', function(e) {
        if (e.key === 'Enter') applyFiltersAndRender();
    });
    document.getElementById('resetBtn').addEventListener('click', function() {
        document.getElementById('searchInput').value = '';
        document.getElementById('startDate').value = '';
        document.getElementById('endDate').value = '';
        document.getElementById('searchCategory').value = 'orgName';
        applyFiltersAndRender();
    });
</script>
</body>
</html>
