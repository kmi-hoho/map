<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>지진관측장비 검정 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        
        #header { 
            padding: 10px 15px; background-color: #f8f9fa; border-bottom: 1px solid #ddd; 
            z-index: 1000; position: relative; display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; font-size: 14px;
        }
        
        #dataRefDate { position: absolute; right: 20px; font-size: 12px; color: #555; font-weight: bold; }
        .header-divider { border-left: 1px solid #ccc; height: 24px; }
        input[type="text"], input[type="date"], select { padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 5px 10px; border: 1px solid #999; background-color: #fff; cursor: pointer; border-radius: 4px; font-family: 'Malgun Gothic', sans-serif; }
        button:hover { background-color: #e9ecef; }
        #downloadBtn { background-color: #1a73e8; color: white; border: 1px solid #1557b0; font-weight: bold; }
        #downloadBtn:hover { background-color: #1557b0; }
        #map { height: calc(100vh - 55px); width: 100%; }
        
        .popup-table { border-collapse: collapse; width: 100%; font-size: 12px; text-align: center; }
        .popup-table th { background-color: #f2f6fc; color: #333; border: 1px solid #c8d4e3; padding: 6px; white-space: nowrap; }
        .popup-table td { border: 1px solid #c8d4e3; padding: 6px; white-space: nowrap; }
        .leaflet-popup-content { min-width: 350px !important; }
        
        .expiring-black td { background-color: #eeeeee; color: #000000; font-weight: bold; }
        .expiring-red td { background-color: #ffe6e6; color: #d93025; font-weight: bold; }
        .expiring-orange td { background-color: #fff3e0; color: #e65100; font-weight: bold; }
        .expiring-yellow td { background-color: #fffde7; color: #f57f17; font-weight: bold; }
        
        .d-day-text { font-size: 11px; margin-left: 4px; }
        
        .leaflet-tooltip { font-family: 'Malgun Gothic', sans-serif; font-weight: bold; font-size: 12px; padding: 6px 10px; text-align: center; line-height: 1.4; border-radius: 4px; border: 1px solid #ccc; }
        .tooltip-black { color: #ffffff; border-color: #333333; background-color: #333333; }
        .tooltip-red { color: #d93025; border-color: #d93025; background-color: #fffafa; }
        .tooltip-orange { color: #e65100; border-color: #e65100; background-color: #fffaf5; }
        .tooltip-yellow { color: #f57f17; border-color: #f57f17; background-color: #fffff0; }
        .tooltip-blue { color: #1a73e8; border-color: #1a73e8; background-color: #f4f8ff; }

        /* 다중 선택 드롭다운 공통 스타일 (기관명, 지역별 모두 적용) */
        .dropdown-container { display: none; position: relative; }
        .dropdown-btn { padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; min-width: 120px; user-select: none; }
        .dropdown-list { 
            display: none; position: absolute; top: 100%; left: 0; background: #fff; border: 1px solid #ccc; 
            border-radius: 4px; max-height: 300px; overflow-y: auto; z-index: 1001; min-width: 160px; padding: 5px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 2px; white-space: nowrap;
        }
        .dropdown-list label { display: block; padding: 4px 5px; cursor: pointer; }
        .dropdown-list label:hover { background-color: #f0f0f0; }
    </style>
</head>
<body>

<div id="header">
    <div><b>지진관측장비 검정 지도</b></div>
    <div class="header-divider"></div>
    <div style="display: flex; align-items: center; gap: 5px;">
        <select id="searchCategory">
            <option value="orgName">기관명</option>
            <option value="branchName">지점명</option>
            <option value="modelName">모델명</option>
            <option value="serialNum">제조번호</option>
            <option value="region">지역별(시도)</option>
        </select>
        
        <!-- 검색어 입력 (지점명, 모델명, 제조번호 선택 시 표시) -->
        <input type="text" id="searchInput" placeholder="검색어 입력" style="display: none;" />
        
        <!-- 기관명 다중 선택 체크박스 레이어 (기본값) -->
        <div id="orgSelectContainer" class="dropdown-container">
            <div id="orgSelectBtn" class="dropdown-btn">기관명 선택 ▼</div>
            <div id="orgCheckboxes" class="dropdown-list">
                <!-- 동적으로 기관명이 채워집니다. -->
            </div>
        </div>

        <!-- 지역별 다중 선택 체크박스 레이어 -->
        <div id="regionSelectContainer" class="dropdown-container">
            <div id="regionSelectBtn" class="dropdown-btn">시도 선택 ▼</div>
            <div id="regionCheckboxes" class="dropdown-list">
                <label><input type="checkbox" value="서울" data-text="서울특별시" class="region-chk"> 서울특별시</label>
                <label><input type="checkbox" value="부산" data-text="부산광역시" class="region-chk"> 부산광역시</label>
                <label><input type="checkbox" value="대구" data-text="대구광역시" class="region-chk"> 대구광역시</label>
                <label><input type="checkbox" value="인천" data-text="인천광역시" class="region-chk"> 인천광역시</label>
                <label><input type="checkbox" value="광주" data-text="광주광역시" class="region-chk"> 광주광역시</label>
                <label><input type="checkbox" value="대전" data-text="대전광역시" class="region-chk"> 대전광역시</label>
                <label><input type="checkbox" value="울산" data-text="울산광역시" class="region-chk"> 울산광역시</label>
                <label><input type="checkbox" value="세종" data-text="세종특별자치시" class="region-chk"> 세종특별자치시</label>
                <label><input type="checkbox" value="경기" data-text="경기도" class="region-chk"> 경기도</label>
                <label><input type="checkbox" value="강원" data-text="강원특별자치도" class="region-chk"> 강원특별자치도</label>
                <label><input type="checkbox" value="충북" data-text="충청북도" class="region-chk"> 충청북도</label>
                <label><input type="checkbox" value="충남" data-text="충청남도" class="region-chk"> 충청남도</label>
                <label><input type="checkbox" value="전북" data-text="전북특별자치도" class="region-chk"> 전북특별자치도</label>
                <label><input type="checkbox" value="전남" data-text="전라남도" class="region-chk"> 전라남도</label>
                <label><input type="checkbox" value="경북" data-text="경상북도" class="region-chk"> 경상북도</label>
                <label><input type="checkbox" value="경남" data-text="경상남도" class="region-chk"> 경상남도</label>
                <label><input type="checkbox" value="제주" data-text="제주특별자치도" class="region-chk"> 제주특별자치도</label>
            </div>
        </div>
    </div>
    <div class="header-divider"></div>
    <div>
        <label><b>검정만료일:</b> </label>
        <input type="date" id="startDate" /> ~ <input type="date" id="endDate" />
    </div>
    <div>
        <button id="searchBtn">검색</button>
        <button id="resetBtn">초기화</button>
        <button id="downloadBtn">자료 다운</button>
    </div>
    <div id="dataRefDate"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    const map = L.map('map').setView([36.5, 127.5], 7);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markers = L.layerGroup().addTo(map);
    let allDevices = [];
    let currentFilteredRows = [];

    const getIconUrl = (color) => `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color}.png`;
    const iconOptions = { shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] };

    const blackIcon = new L.Icon({ iconUrl: getIconUrl('black'), ...iconOptions });
    const redIcon = new L.Icon({ iconUrl: getIconUrl('red'), ...iconOptions });
    const orangeIcon = new L.Icon({ iconUrl: getIconUrl('orange'), ...iconOptions });
    const yellowIcon = new L.Icon({ iconUrl: getIconUrl('gold'), ...iconOptions });
    const blueIcon = new L.Icon({ iconUrl: getIconUrl('blue'), ...iconOptions });

    function formatDate(dateObj) {
        const yyyy = dateObj.getFullYear();
        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
        const dd = String(dateObj.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    // 카테고리 변경 시 UI 전환
    document.getElementById('searchCategory').addEventListener('change', function(e) {
        const val = e.target.value;
        document.getElementById('searchInput').style.display = 'none';
        document.getElementById('regionSelectContainer').style.display = 'none';
        document.getElementById('orgSelectContainer').style.display = 'none';

        if (val === 'region') {
            document.getElementById('regionSelectContainer').style.display = 'inline-block';
        } else if (val === 'orgName') {
            document.getElementById('orgSelectContainer').style.display = 'inline-block';
        } else {
            document.getElementById('searchInput').style.display = 'inline-block';
        }
    });

    // 드롭다운 공통 제어 함수
    function setupDropdown(btnId, listId, containerId) {
        document.getElementById(btnId).addEventListener('click', function(e) {
            const list = document.getElementById(listId);
            // 다른 열려있는 드롭다운 닫기
            document.querySelectorAll('.dropdown-list').forEach(el => {
                if (el.id !== listId) el.style.display = 'none';
            });
            list.style.display = list.style.display === 'none' || list.style.display === '' ? 'block' : 'none';
            e.stopPropagation();
        });

        document.addEventListener('click', function(e) {
            const container = document.getElementById(containerId);
            const list = document.getElementById(listId);
            if (container && !container.contains(e.target)) {
                list.style.display = 'none';
            }
        });
    }

    setupDropdown('regionSelectBtn', 'regionCheckboxes', 'regionSelectContainer');
    setupDropdown('orgSelectBtn', 'orgCheckboxes', 'orgSelectContainer');

    // 지역 체크박스 텍스트 업데이트
    document.querySelectorAll('.region-chk').forEach(chk => {
        chk.addEventListener('change', function() {
            const checkedCount = document.querySelectorAll('.region-chk:checked').length;
            const btn = document.getElementById('regionSelectBtn');
            if (checkedCount === 0) {
                btn.innerText = '시도 선택 ▼';
            } else {
                btn.innerText = `${checkedCount}개 지역 선택됨 ▼`;
            }
        });
    });

    fetch('검정대상.csv')
        .then(response => {
            if (!response.ok) throw new Error("네트워크 응답이 정상이 아닙니다.");
            return response.arrayBuffer();
        })
        .then(buffer => {
            let csvText = "";
            try {
                const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
                csvText = utf8Decoder.decode(buffer);
            } catch (e) {
                const euckrDecoder = new TextDecoder('euc-kr');
                csvText = euckrDecoder.decode(buffer);
            }
            
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    allDevices = [];
                    const uniqueOrgs = new Set(); // 기관명 추출용 Set
                    let maxInspectionDate = ""; 
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);

                    data.forEach(row => {
                        const rowValues = Object.values(row);
                        const getVal = (key) => row[key] ? row[key].trim() : '';
                        
                        let lat = parseFloat(getVal('위도'));
                        let lng = parseFloat(getVal('경도'));
                        
                        if (isNaN(lat) || isNaN(lng)) {
                            lat = parseFloat(rowValues[3]);
                            lng = parseFloat(rowValues[4]);
                        }

                        if (!isNaN(lat) && !isNaN(lng)) {
                            const address = getVal('주소') || (rowValues.length > 5 ? rowValues[5] : '');
                            const orgName = getVal('기관명');
                            if (orgName) uniqueOrgs.add(orgName); // 고유 기관명 추가

                            const validPeriodDate = getVal('검정유효기간');
                            const testDateStr = getVal('검정일') || (rowValues.length > 0 ? rowValues[rowValues.length - 1].trim() : ''); 
                            let finalDateStr = "";

                            if (testDateStr && testDateStr.length >= 8) {
                                if (testDateStr > maxInspectionDate) {
                                    maxInspectionDate = testDateStr;
                                }
                                
                                const dateObj = new Date(testDateStr);
                                if (!isNaN(dateObj)) {
                                    dateObj.setFullYear(dateObj.getFullYear() + 5);
                                    dateObj.setDate(dateObj.getDate() - 1);
                                    finalDateStr = formatDate(dateObj);
                                } else {
                                    finalDateStr = testDateStr;
                                }
                            } else {
                                finalDateStr = validPeriodDate;
                            }

                            let urgencyLevel = 999; 
                            let diffDaysForDday = null;
                            
                            if (finalDateStr) {
                                const expDate = new Date(finalDateStr);
                                if (!isNaN(expDate)) {
                                    const diffTime = expDate - today;
                                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                                    diffDaysForDday = diffDays;
                                    
                                    if (diffDays < 0) urgencyLevel = 0;
                                    else if (diffDays <= 30) urgencyLevel = 1;
                                    else if (diffDays <= 60) urgencyLevel = 2;
                                    else if (diffDays <= 90) urgencyLevel = 3;
                                }
                            }

                            allDevices.push({
                                lat: lat, lng: lng, address: address, 
                                orgName: orgName, branchName: getVal('지점명'),
                                modelName: getVal('모델명'), serialNum: getVal('제조번호'), latestDate: finalDateStr, 
                                urgencyLevel: urgencyLevel, diffDays: diffDaysForDday,
                                originalRow: row 
                            });
                        }
                    });

                    // 기관명 체크박스 동적 생성
                    const orgList = Array.from(uniqueOrgs).sort();
                    const orgCheckboxesDiv = document.getElementById('orgCheckboxes');
                    orgCheckboxesDiv.innerHTML = ''; // 초기화
                    orgList.forEach(org => {
                        const label = document.createElement('label');
                        label.innerHTML = `<input type="checkbox" value="${org}" class="org-chk"> ${org}`;
                        orgCheckboxesDiv.appendChild(label);
                    });

                    // 동적으로 생성된 기관명 체크박스에 이벤트 연결
                    document.querySelectorAll('.org-chk').forEach(chk => {
                        chk.addEventListener('change', function() {
                            const checkedCount = document.querySelectorAll('.org-chk:checked').length;
                            const btn = document.getElementById('orgSelectBtn');
                            if (checkedCount === 0) {
                                btn.innerText = '기관명 선택 ▼';
                            } else {
                                btn.innerText = `${checkedCount}개 기관 선택됨 ▼`;
                            }
                        });
                    });

                    if (maxInspectionDate) {
                        document.getElementById('dataRefDate').innerText = `[데이터 기준: ${maxInspectionDate} 검정완료분]`;
                    }

                    // 초기 UI 상태 적용 (카테고리 강제 트리거)
                    document.getElementById('searchCategory').dispatchEvent(new Event('change'));

                    applyFiltersAndRender();
                }
            });
        })
        .catch(error => alert("데이터를 불러오는 데 실패했습니다: " + error.message));

    function applyFiltersAndRender() {
        markers.clearLayers();
        currentFilteredRows = []; 
        const category = document.getElementById('searchCategory').value;
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        
        const checkedRegions = Array.from(document.querySelectorAll('.region-chk:checked')).map(chk => {
            return { shortName: chk.value, fullName: chk.getAttribute('data-text') };
        });

        // 기관명 체크된 항목들 배열
        const checkedOrgs = Array.from(document.querySelectorAll('.org-chk:checked')).map(chk => chk.value);
        
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const groupedData = {};

        allDevices.forEach(dev => {
            let textMatch = true;
            
            if (category === 'region') {
                if (checkedRegions.length > 0) {
                    let matchAny = false;
                    for (const region of checkedRegions) {
                        if (dev.address && (dev.address.includes(region.shortName) || dev.address.includes(region.fullName))) {
                            matchAny = true;
                            break;
                        }
                    }
                    if (!matchAny) textMatch = false;
                }
            } else if (category === 'orgName') {
                // 기관명 체크박스로 필터링
                if (checkedOrgs.length > 0) {
                    if (!checkedOrgs.includes(dev.orgName)) {
                        textMatch = false;
                    }
                }
            } else if (keyword) {
                // 모델명, 지점명, 제조번호 등 텍스트 검색
                const targetValue = (dev[category] || '').toLowerCase();
                if (!targetValue.includes(keyword)) textMatch = false;
            }

            let dateMatch = true;
            if (dev.latestDate) {
                if (startDate && dev.latestDate < startDate) dateMatch = false;
                if (endDate && dev.latestDate > endDate) dateMatch = false;
            } else if (startDate || endDate) {
                dateMatch = false; 
            }

            if (textMatch && dateMatch) {
                currentFilteredRows.push(dev.originalRow); 

                const locationKey = `${dev.lat}_${dev.lng}`;
                if (!groupedData[locationKey]) {
                    groupedData[locationKey] = { 
                        lat: dev.lat, lng: dev.lng, orgName: dev.orgName, branchName: dev.branchName, 
                        devices: [], maxUrgency: 999, earliestDate: '9999-99-99'
                    };
                }
                groupedData[locationKey].devices.push(dev);
                
                if (dev.urgencyLevel < groupedData[locationKey].maxUrgency) {
                    groupedData[locationKey].maxUrgency = dev.urgencyLevel;
                }

                if (dev.latestDate && dev.latestDate < groupedData[locationKey].earliestDate) {
                    groupedData[locationKey].earliestDate = dev.latestDate;
                }
            }
        });

        Object.values(groupedData).forEach(group => {
            const devices = group.devices;
            let tableRowsHtml = "";
            
            devices.forEach((dev, index) => {
                let rowClass = '';
                let dDayString = '';
                
                if (dev.urgencyLevel <= 3 && dev.diffDays !== null) {
                    if (dev.diffDays < 0) {
                        dDayString = `<span class="d-day-text" style="color:red;">(D+${Math.abs(dev.diffDays)})</span>`;
                    } else if (dev.diffDays === 0) {
                        dDayString = `<span class="d-day-text">(D-Day)</span>`;
                    } else {
                        dDayString = `<span class="d-day-text">(D-${dev.diffDays})</span>`;
                    }
                }

                if (dev.urgencyLevel === 0) rowClass = ' class="expiring-black"';
                else if (dev.urgencyLevel === 1) rowClass = ' class="expiring-red"';
                else if (dev.urgencyLevel === 2) rowClass = ' class="expiring-orange"';
                else if (dev.urgencyLevel === 3) rowClass = ' class="expiring-yellow"';

                tableRowsHtml += `<tr${rowClass}>`;
                if (index === 0) {
                    tableRowsHtml += `<td rowspan="${devices.length}">${dev.orgName}</td>`;
                    tableRowsHtml += `<td rowspan="${devices.length}">${dev.branchName}</td>`;
                }
                tableRowsHtml += `<td>${dev.modelName}</td><td>${dev.serialNum}</td><td>${dev.latestDate} ${dDayString}</td></tr>`;
            });

            const popupContent = `
                <table class="popup-table">
                    <thead><tr><th>기관명</th><th>지점명</th><th>모델명</th><th>제조번호</th><th>검정만료일</th></tr></thead>
                    <tbody>${tableRowsHtml}</tbody>
                </table>`;

            let markerIcon = blueIcon;
            let tooltipCssClass = 'tooltip-blue';

            if (group.maxUrgency === 0) {
                markerIcon = blackIcon;
                tooltipCssClass = 'tooltip-black';
            } else if (group.maxUrgency === 1) {
                markerIcon = redIcon;
                tooltipCssClass = 'tooltip-red';
            } else if (group.maxUrgency === 2) {
                markerIcon = orangeIcon;
                tooltipCssClass = 'tooltip-orange';
            } else if (group.maxUrgency === 3) {
                markerIcon = yellowIcon;
                tooltipCssClass = 'tooltip-yellow';
            }

            const tooltipText = group.earliestDate !== '9999-99-99' 
                ? `${group.orgName} / ${group.branchName}<br>(${group.earliestDate})` 
                : `${group.orgName} / ${group.branchName}`;

            L.marker([group.lat, group.lng], { icon: markerIcon })
                .addTo(markers)
                .bindPopup(popupContent, { maxWidth: 600 })
                .bindTooltip(tooltipText, { direction: 'top', offset: [0, -35], className: tooltipCssClass });
        });
    }

    document.getElementById('searchBtn').addEventListener('click', applyFiltersAndRender);
    document.getElementById('searchInput').addEventListener('keyup', function(e) {
        if (e.key === 'Enter') applyFiltersAndRender();
    });
    
    document.getElementById('resetBtn').addEventListener('click', function() {
        document.getElementById('searchCategory').value = 'orgName';
        document.getElementById('searchInput').value = '';
        document.getElementById('startDate').value = '';
        document.getElementById('endDate').value = '';
        
        // 지역 초기화
        document.querySelectorAll('.region-chk').forEach(chk => chk.checked = false);
        document.getElementById('regionSelectBtn').innerText = '시도 선택 ▼';
        
        // 기관명 초기화
        document.querySelectorAll('.org-chk').forEach(chk => chk.checked = false);
        document.getElementById('orgSelectBtn').innerText = '기관명 선택 ▼';
        
        // 카테고리 기본값에 맞게 디스플레이 상태 수동 업데이트
        document.getElementById('searchInput').style.display = 'none';
        document.getElementById('regionSelectContainer').style.display = 'none';
        document.getElementById('orgSelectContainer').style.display = 'inline-block';
        
        applyFiltersAndRender();
    });

    document.getElementById('downloadBtn').addEventListener('click', function() {
        if (currentFilteredRows.length === 0) {
            alert("다운로드할 데이터가 없습니다.");
            return;
        }
        
        const csvString = Papa.unparse(currentFilteredRows);
        const blob = new Blob(["\uFEFF" + csvString], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        
        link.setAttribute("href", url);
        link.setAttribute("download", "지진관측장비_검색결과.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>
</body>
</html>
