<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>지진관측장비 검정 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        
        #header { 
            padding: 10px 15px; 
            background-color: #f8f9fa; 
            border-bottom: 1px solid #ddd; 
            z-index: 1000; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 15px; 
            flex-wrap: wrap; 
            font-size: 14px;
        }
        
        /* 우측 상단 기준일 표시 텍스트 스타일 */
        #dataRefDate {
            position: absolute;
            right: 20px;
            font-size: 12px;
            color: #555;
            font-weight: bold;
        }
        
        .header-divider { border-left: 1px solid #ccc; height: 24px; }
        input[type="text"], input[type="date"], select { padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 5px 10px; border: 1px solid #999; background-color: #fff; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #e9ecef; }
        #map { height: calc(100vh - 55px); width: 100%; }
        
        .popup-table { border-collapse: collapse; width: 100%; font-size: 12px; text-align: center; }
        .popup-table th { background-color: #f2f6fc; color: #333; border: 1px solid #c8d4e3; padding: 6px; white-space: nowrap; }
        .popup-table td { border: 1px solid #c8d4e3; padding: 6px; white-space: nowrap; }
        .leaflet-popup-content { min-width: 350px !important; }
        
        .expiring-black td { background-color: #eeeeee; color: #000000; font-weight: bold; }
        .expiring-red td { background-color: #ffe6e6; color: #d93025; font-weight: bold; }
        .expiring-orange td { background-color: #fff3e0; color: #e65100; font-weight: bold; }
        .expiring-yellow td { background-color: #fffde7; color: #f57f17; font-weight: bold; }
        
        .d-day-text { font-size: 11px; margin-left: 4px; }
        
        .leaflet-tooltip { 
            font-family: 'Malgun Gothic', sans-serif; font-weight: bold; font-size: 12px; 
            padding: 6px 10px; text-align: center; line-height: 1.4; border-radius: 4px; border: 1px solid #ccc;
        }
        .tooltip-black { color: #ffffff; border-color: #333333; background-color: #333333; }
        .tooltip-red { color: #d93025; border-color: #d93025; background-color: #fffafa; }
        .tooltip-orange { color: #e65100; border-color: #e65100; background-color: #fffaf5; }
        .tooltip-yellow { color: #f57f17; border-color: #f57f17; background-color: #fffff0; }
        .tooltip-blue { color: #1a73e8; border-color: #1a73e8; background-color: #f4f8ff; }
    </style>
</head>
<body>

<div id="header">
    <div><b>지진관측장비 검정 지도</b></div>
    <div class="header-divider"></div>
    <div>
        <select id="searchCategory">
            <option value="orgName">기관명</option>
            <option value="branchName">지점명</option>
            <option value="modelName">모델명</option>
            <option value="serialNum">제조번호</option>
        </select>
        <input type="text" id="searchInput" placeholder="검색어 입력" />
    </div>
    <div class="header-divider"></div>
    <div>
        <label><b>검정만료일:</b> </label>
        <input type="date" id="startDate" /> ~ <input type="date" id="endDate" />
    </div>
    <div>
        <button id="searchBtn">검색</button>
        <button id="resetBtn">초기화</button>
    </div>
    <!-- 우측 상단 데이터 기준일 표시 영역 -->
    <div id="dataRefDate"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    const map = L.map('map').setView([36.5, 127.5], 7);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markers = L.layerGroup().addTo(map);
    let allDevices = [];

    const getIconUrl = (color) => `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color}.png`;
    const iconOptions = { shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] };

    const blackIcon = new L.Icon({ iconUrl: getIconUrl('black'), ...iconOptions });
    const redIcon = new L.Icon({ iconUrl: getIconUrl('red'), ...iconOptions });
    const orangeIcon = new L.Icon({ iconUrl: getIconUrl('orange'), ...iconOptions });
    const yellowIcon = new L.Icon({ iconUrl: getIconUrl('gold'), ...iconOptions });
    const blueIcon = new L.Icon({ iconUrl: getIconUrl('blue'), ...iconOptions });

    function formatDate(dateObj) {
        const yyyy = dateObj.getFullYear();
        const mm = String(dateObj.getMonth() - 1).padStart(2, '0');
        const dd = String(dateObj.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    fetch('검정대상.csv')
        .then(response => {
            if (!response.ok) throw new Error("네트워크 응답이 정상이 아닙니다.");
            return response.arrayBuffer();
        })
        .then(buffer => {
            const decoder = new TextDecoder('euc-kr');
            const csvText = decoder.decode(buffer);
            
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    allDevices = [];
                    let maxInspectionDate = ""; // 가장 늦은 검정일 저장 변수
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);

                    data.forEach(row => {
                        const rowValues = Object.values(row);
                        const getVal = (key) => row[key] ? row[key].trim() : '';
                        const lat = parseFloat(getVal('위도') || rowValues[3]); 
                        const lng = parseFloat(getVal('경도') || rowValues[4]); 

                        if (!isNaN(lat) && !isNaN(lng)) {
                            const validPeriodDate = getVal('검정유효기간');
                            const testDateStr = getVal('검정일') || (rowValues.length > 0 ? rowValues[rowValues.length - 1].trim() : ''); 
                            let finalDateStr = "";

                            // 최대 검정일 갱신
                            if (testDateStr && testDateStr.length >= 8) {
                                if (testDateStr > maxInspectionDate) {
                                    maxInspectionDate = testDateStr;
                                }
                                
                                const dateObj = new Date(testDateStr);
                                if (!isNaN(dateObj)) {
                                    dateObj.setFullYear(dateObj.getFullYear() + 5);
                                    dateObj.setDate(dateObj.getDate() - 1);
                                    finalDateStr = formatDate(dateObj);
                                } else {
                                    finalDateStr = testDateStr;
                                }
                            } else {
                                finalDateStr = validPeriodDate;
                            }

                            let urgencyLevel = 999; 
                            let diffDaysForDday = null;
                            
                            if (finalDateStr) {
                                const expDate = new Date(finalDateStr);
                                if (!isNaN(expDate)) {
                                    const diffTime = expDate - today;
                                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                                    diffDaysForDday = diffDays;
                                    
                                    if (diffDays < 0) urgencyLevel = 0;
                                    else if (diffDays <= 30) urgencyLevel = 1;
                                    else if (diffDays <= 60) urgencyLevel = 2;
                                    else if (diffDays <= 90) urgencyLevel = 3;
                                }
                            }

                            allDevices.push({
                                lat: lat, lng: lng, orgName: getVal('기관명'), branchName: getVal('지점명'),
                                modelName: getVal('모델명'), serialNum: getVal('제조번호'), latestDate: finalDateStr, 
                                urgencyLevel: urgencyLevel,
                                diffDays: diffDaysForDday
                            });
                        }
                    });

                    // 추출한 기준일을 화면에 반영
                    if (maxInspectionDate) {
                        document.getElementById('dataRefDate').innerText = `[자료기준: ${maxInspectionDate}]`;
                    }

                    applyFiltersAndRender();
                }
            });
        })
        .catch(error => alert("데이터를 불러오는 데 실패했습니다: " + error.message));

    function applyFiltersAndRender() {
        markers.clearLayers();
        const category = document.getElementById('searchCategory').value;
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const groupedData = {};

        allDevices.forEach(dev => {
            let textMatch = true;
            if (keyword) {
                const targetValue = (dev[category] || '').toLowerCase();
                if (!targetValue.includes(keyword)) textMatch = false;
            }

            let dateMatch = true;
            if (dev.latestDate) {
                if (startDate && dev.latestDate < startDate) dateMatch = false;
                if (endDate && dev.latestDate > endDate) dateMatch = false;
            } else if (startDate || endDate) {
                dateMatch = false; 
            }

            if (textMatch && dateMatch) {
                const locationKey = `${dev.lat}_${dev.lng}`;
                if (!groupedData[locationKey]) {
                    groupedData[locationKey] = { 
                        lat: dev.lat, lng: dev.lng, orgName: dev.orgName, branchName: dev.branchName, 
                        devices: [], maxUrgency: 999, earliestDate: '9999-99-99'
                    };
                }
                groupedData[locationKey].devices.push(dev);
                
                if (dev.urgencyLevel < groupedData[locationKey].maxUrgency) {
                    groupedData[locationKey].maxUrgency = dev.urgencyLevel;
                }

                if (dev.latestDate && dev.latestDate < groupedData[locationKey].earliestDate) {
                    groupedData[locationKey].earliestDate = dev.latestDate;
                }
            }
        });

        Object.values(groupedData).forEach(group => {
            const devices = group.devices;
            let tableRowsHtml = "";
            
            devices.forEach((dev, index) => {
                let rowClass = '';
                let dDayString = '';
                
                if (dev.urgencyLevel <= 3 && dev.diffDays !== null) {
                    if (dev.diffDays < 0) {
                        dDayString = `<span class="d-day-text" style="color:red;">(D+${Math.abs(dev.diffDays)})</span>`;
                    } else if (dev.diffDays === 0) {
                        dDayString = `<span class="d-day-text">(D-Day)</span>`;
                    } else {
                        dDayString = `<span class="d-day-text">(D-${dev.diffDays})</span>`;
                    }
                }

                if (dev.urgencyLevel === 0) rowClass = ' class="expiring-black"';
                else if (dev.urgencyLevel === 1) rowClass = ' class="expiring-red"';
                else if (dev.urgencyLevel === 2) rowClass = ' class="expiring-orange"';
                else if (dev.urgencyLevel === 3) rowClass = ' class="expiring-yellow"';

                tableRowsHtml += `<tr${rowClass}>`;
                if (index === 0) {
                    tableRowsHtml += `<td rowspan="${devices.length}">${dev.orgName}</td>`;
                    tableRowsHtml += `<td rowspan="${devices.length}">${dev.branchName}</td>`;
                }
                tableRowsHtml += `<td>${dev.modelName}</td><td>${dev.serialNum}</td><td>${dev.latestDate} ${dDayString}</td></tr>`;
            });

            const popupContent = `
                <table class="popup-table">
                    <thead><tr><th>기관명</th><th>지점명</th><th>모델명</th><th>제조번호</th><th>검정만료일</th></tr></thead>
                    <tbody>${tableRowsHtml}</tbody>
                </table>`;

            let markerIcon = blueIcon;
            let tooltipCssClass = 'tooltip-blue';

            if (group.maxUrgency === 0) {
                markerIcon = blackIcon;
                tooltipCssClass = 'tooltip-black';
            } else if (group.maxUrgency === 1) {
                markerIcon = redIcon;
                tooltipCssClass = 'tooltip-red';
            } else if (group.maxUrgency === 2) {
                markerIcon = orangeIcon;
                tooltipCssClass = 'tooltip-orange';
            } else if (group.maxUrgency === 3) {
                markerIcon = yellowIcon;
                tooltipCssClass = 'tooltip-yellow';
            }

            const tooltipText = group.earliestDate !== '9999-99-99' 
                ? `${group.orgName} / ${group.branchName}<br>(${group.earliestDate})` 
                : `${group.orgName} / ${group.branchName}`;

            L.marker([group.lat, group.lng], { icon: markerIcon })
                .addTo(markers)
                .bindPopup(popupContent, { maxWidth: 600 })
                .bindTooltip(tooltipText, { direction: 'top', offset: [0, -35], className: tooltipCssClass });
        });
    }

    document.getElementById('searchBtn').addEventListener('click', applyFiltersAndRender);
    document.getElementById('searchInput').addEventListener('keyup', function(e) {
        if (e.key === 'Enter') applyFiltersAndRender();
    });
    document.getElementById('resetBtn').addEventListener('click', function() {
        document.getElementById('searchInput').value = '';
        document.getElementById('startDate').value = '';
        document.getElementById('endDate').value = '';
        document.getElementById('searchCategory').value = 'orgName';
        applyFiltersAndRender();
    });
</script>
</body>
</html>
